dataset_path: Stephen-Xie/TowerOfHanoi
dataset_name: null
output_type: generate_until
test_split: test
num_fewshot: 0
doc_to_text: !function utils.doc_to_text
doc_to_target: !function utils.doc_to_target
process_results: !function utils.process_results
filter_list:
  - name: "extract_moves"
    filter:
      - function: "custom"
        filter_fn: !function utils.extract_moves_from_response
metric_list:
  - metric: hanoi_solution_valid
    aggregation: mean
    higher_is_better: true
  - metric: hanoi_goal_reached
    aggregation: mean
    higher_is_better: true
  - metric: hanoi_move_accuracy
    aggregation: mean
    higher_is_better: true
  - metric: hanoi_first_error_step
    aggregation: mean
    higher_is_better: true
  - metric: hanoi_num_moves
    aggregation: mean
    higher_is_better: false
generation_kwargs:
  until:
    - "\n\n"
    - "Question:"
    - "</s>"
    - "<|im_end|>"
  max_gen_toks: 2048
  do_sample: false
  temperature: 0.0
metadata:
  version: 1.0
  description: "Tower of Hanoi puzzle solver evaluation"

